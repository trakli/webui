name: PR screenshots

on:
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Baseline branch or commit
        default: dev
        required: true
      journeys:
        description: Journey names, one per line (empty selects affected screens)
        default: ''
      viewports:
        description: Viewports to request (desktop, phone, or all)
        default: desktop
      all:
        description: Run every saved journey
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pagebeam-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PAGEBEAM_BACKEND_REVISION: 75e768c8b93fce4744e2ed1d76ed5fe4cc8473d1

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      capture-needed: ${{ steps.pagebeam.outputs.capture-needed }}
      artifact-id: ${{ steps.selection.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: after
          fetch-depth: 0
          persist-credentials: false
      - uses: pagebeam/pagebeam@d60115e5803cac47c77f5d460d41a6c2eae9e46f
        id: pagebeam
        continue-on-error: true
        env:
          PAGEBEAM_BACKEND_PATH: ${{ github.workspace }}/backend
        with:
          command: capture
          checkout: 'false'
          cwd: after
          plan: 'true'
          prepare: |
            node .pagebeam/configure-captures.mjs
            printf 'PAGEBEAM_CLI=%s\n' "$PAGEBEAM_CLI" >> "$GITHUB_ENV"
          capture-config: .pagebeam/capture.json
          environment: ci
          target: ci
          base: ${{ github.event.pull_request.base.sha || inputs.base }}
          journeys: ${{ inputs.journeys }}
          viewports: ${{ inputs.viewports || 'desktop' }}
          all: ${{ inputs.all || false }}
      - name: Save skipped or incomplete selection
        if: always() && steps.pagebeam.outputs.capture-needed == 'false'
        env:
          CAPTURE_BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
        run: |
          set +e
          node "$PAGEBEAM_CLI" capture --cwd after --config .pagebeam/capture.json \
            --environment ci --target ci --base "$CAPTURE_BASE" \
            --out "$RUNNER_TEMP/pagebeam-selection" --json
          code=$?
          if [ "$code" != 0 ] && [ "$code" != 2 ]; then exit "$code"; fi
      - uses: actions/upload-artifact@v4
        id: selection
        if: always() && steps.pagebeam.outputs.capture-needed == 'false'
        with:
          name: pagebeam-selection-${{ github.run_id }}
          path: ${{ runner.temp }}/pagebeam-selection
          if-no-files-found: error
          retention-days: 14
      - name: Require complete planning
        if: always() && steps.pagebeam.outcome != 'success'
        run: exit 1

  captures:
    needs: plan
    if: needs.plan.outputs.capture-needed == 'true'

    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: trakli_screenshots
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      APP_ENV: testing
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8100
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: trakli_screenshots
      DB_USERNAME: root
      DB_PASSWORD: ci-only-password
      CACHE_DRIVER: array
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FIREBASE_CREDENTIALS: ''
      TELESCOPE_ENABLED: 'false'
      PULSE_ENABLED: 'false'
      FRONTEND_URL: http://127.0.0.1:4300
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:4300
    outputs:
      artifact-id: ${{ steps.pagebeam.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: after
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: trakli/webservice
          ref: ${{ env.PAGEBEAM_BACKEND_REVISION }}
          path: backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: after/package-lock.json
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, gd, zip, bcmath, intl
          tools: composer
          coverage: none
      - name: Prepare isolated API
        working-directory: backend
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
      - uses: pagebeam/pagebeam@d60115e5803cac47c77f5d460d41a6c2eae9e46f
        id: pagebeam
        env:
          PAGEBEAM_BACKEND_PATH: ${{ github.workspace }}/backend
        with:
          command: capture
          checkout: 'false'
          cwd: after
          prepare: node .pagebeam/configure-captures.mjs
          install: npm ci
          baseline-install: npm ci
          capture-config: .pagebeam/capture.json
          environment: ci
          target: ci
          compare-base: ${{ github.event.pull_request.base.sha || inputs.base }}
          journeys: ${{ inputs.journeys }}
          viewports: ${{ inputs.viewports || 'desktop' }}
          all: ${{ inputs.all || false }}

  comment:
    needs: [plan, captures]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (needs.captures.outputs.artifact-id != '' || needs.plan.outputs.artifact-id != '')
    permissions:
      contents: write
      actions: read
      pull-requests: write
    uses: pagebeam/pagebeam/.github/workflows/report-capture.yml@d60115e5803cac47c77f5d460d41a6c2eae9e46f
    with:
      artifact-id: ${{ needs.captures.outputs.artifact-id || needs.plan.outputs.artifact-id }}
      pull-request: ${{ format('{0}', github.event.pull_request.number) }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      status: ${{ needs.captures.result != 'skipped' && needs.captures.result || needs.plan.result }}
