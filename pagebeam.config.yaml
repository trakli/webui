docs:
  root: ../docs

apps:
  - name: ui
    path: .
  - name: webservice
    path: ../webservice

tours:
  targets:
    local: { url: http://localhost:3001 }

  accounts:
    newcomer:
      purpose: somebody who has just registered and has not finished setup
      login:
        form:
          url: /login
          username: input[type=email]
          password: .password-input input
          submit: button[type=submit]
      confirm: .onboarding-page
      fresh: true
      seed:
        command: >-
          cd ../webservice &&
          sh -c "${TRAKLI_DEMO_COMMAND:-docker compose exec -T --user www-data app php artisan demo} onboarding"

    active:
      purpose: a user with a month of wallets, transactions and a transfer
      login:
        form:
          url: /login
          username: input[type=email]
          password: .password-input input
          submit: button[type=submit]
      confirm: img.avatar-image
      fresh: true
      seed:
        command: >-
          cd ../webservice &&
          sh -c "${TRAKLI_DEMO_COMMAND:-docker compose exec -T --user www-data app php artisan demo} active-month"
      requires:
        - goto: /transactions
          count: { selector: '[data-testid="ledger-row"]', min: 10 }

    shared:
      purpose: an owner with a month of personal finances and a new family space that has not been paid for
      login:
        form:
          url: /login
          username: input[type=email]
          password: .password-input input
          submit: button[type=submit]
      confirm: img.avatar-image
      fresh: true
      seed:
        command: >-
          cd ../webservice &&
          sh -c "${TRAKLI_DEMO_COMMAND:-docker compose exec -T --user www-data app php artisan demo} shared-space"

  journeys:
    onboarding:
      account: newcomer
      viewports:
        - { name: desktop, width: 1440, height: 900, scale: 2 }
        - { name: phone, width: 390, height: 844, scale: 3 }
      steps:
        - goto: /onboarding
        - wait: .language-grid
        - select: { selector: .country-select, value: Germany }
        - shot:
            name: language
            caption: Setup starts with your language and where you live
            focus: [.language-grid, .country-field]
            fullPage: true
        - click: .step-actions .primary-btn
        - wait: .wallet-currency-setup
        - select: { selector: .currency-column .currency-select, value: EUR }
        - shot:
            name: wallet
            caption: Every account starts with a cash wallet in the currency you choose
            focus: [.wallet-cards, .currency-column]
        - click: .step-actions .primary-btn
        - wait: .categories-setup
        - shot:
            name: categories
            caption: One tap gives you a ready set of categories
            focus: [.categories-card]

    log-a-coffee:
      account: active
      viewports:
        - { name: desktop, width: 1440, height: 900, scale: 2 }
        - { name: phone, width: 390, height: 844, scale: 3 }
      steps:
        - wait: 61000
        - goto: /transactions/new
        - wait: .transaction-form
        - fill: { selector: '.transaction-amount input[type=number]', value: '4.20' }
        - fill: { selector: .transaction-form textarea, value: Oat flat white }
        - fill: { selector: 'input[placeholder="Search party..."]', value: Corner }
        - click: .dropdown-list li:has-text("Corner Coffee")
        - fill: { selector: 'input[placeholder="Search wallet..."]', value: Cash }
        - click: .dropdown-list li:has-text("Cash")
        - fill: { selector: 'input[placeholder="Search categories..."]', value: Food }
        - click: .dropdown-list li:has-text("Food & Dining")
        - shot:
            name: coffee-form
            caption: A coffee takes an amount, a place and a wallet
            focus: [.transaction-amount, .transaction-form .form]
        - click: .submit-button
        - wait: 2000
        - goto: /transactions
        - expect:
            selector: '[data-testid="ledger-row"]:has-text("Oat flat white")'
            text: '4.20'
        - shot:
            name: coffee-recorded
            caption: The coffee is at the top of your transactions
            focus:
              - '[data-testid="ledger-row"]:has-text("Oat flat white")'

    month-overview:
      account: active
      viewports:
        - { name: desktop, width: 1440, height: 900, scale: 2 }
        - { name: phone, width: 390, height: 844, scale: 3 }
      steps:
        - wait: 61000
        - goto: /dashboard
        - wait: '[data-testid="ledger-overview"]'
        - wait: '[data-testid="ledger-flow"]'
        - wait: 1500
        - shot:
            name: dashboard
            caption: The month at a glance, with every screen one click away
        - click: '[data-testid="ledger-command"]'
        - wait: '[data-testid="ledger-palette"]'
        - fill: { selector: '[data-testid="ledger-palette"] input', value: cash }
        - shot:
            name: ledger-palette
            caption: Jump to a page, a wallet or a person, or ask a question
            focus: ['[data-testid="ledger-palette"]']

    wallets:
      account: active
      viewports:
        - { name: desktop, width: 1440, height: 900, scale: 2 }
        - { name: phone, width: 390, height: 844, scale: 3 }
      steps:
        - wait: 61000
        - goto: /wallets
        - wait: .split-list .row
        - shot:
            name: wallets
            caption: Cash, bank and savings side by side, each in its own currency
            focus: [.split-list .list, .stats-strip]
        - click: .split-list .row:has-text("Dollar Savings")
        - wait: .split-detail .hero-name:has-text("Dollar Savings")
        - shot:
            name: dollar-savings
            caption: Savings kept in dollars, with their own balance and income
            focus: [.split-detail .detail-body]

    shared-space:
      account: shared
      viewports:
        - { name: desktop, width: 1440, height: 900, scale: 2 }
        - { name: phone, width: 390, height: 844, scale: 3 }
      steps:
        - goto: /workspaces
        - wait: .space-card
        - shot:
            name: shared-spaces
            caption: Personal finances and shared spaces stay separate
            fullPage: true
        - click: '.space-card button:has-text("Switch to this space")'
        - wait: '[data-testid="space-kpis"]'
        - shot:
            name: shared-dashboard
            route: /dashboard
            caption: The shared dashboard shows this household's money
            fullPage: true


    ledger-reports:
      account: active
      viewports:
        - { name: desktop, width: 1440, height: 900, scale: 2 }
        - { name: phone, width: 390, height: 844, scale: 3 }
      steps:
        - wait: 61000
        - goto: /reports
        - wait: .ledger-shell .tabs
        - shot:
            name: reports-overview
            caption: Reports open on the month, with more views a tab away
        - click: '.tabs .tab:has-text("Calendar")'
        - wait: 800
        - shot:
            name: reports-calendar
            caption: Each day of the month, coloured by what you spent
        - click: '.tabs .tab:has-text("Flow")'
        - wait: 800
        - shot:
            name: reports-flow
            caption: Where the money came from and where it went
        - click: '.tabs .tab:has-text("Charts")'
        - wait: 800
        - shot:
            name: reports-charts
            caption: Income and spending over time
        - click: '.tabs .tab:has-text("Categories")'
        - wait: 800
        - shot:
            name: reports-categories
            caption: Spending by category, biggest first
        - click: '.tabs .tab:has-text("Position")'
        - wait: 800
        - shot:
            name: reports-position
            caption: What you own and what you owe

    ledger-screens:
      account: active
      viewports:
        - { name: desktop, width: 1440, height: 900, scale: 2 }
        - { name: phone, width: 390, height: 844, scale: 3 }
      steps:
        - wait: 61000
        - goto: /transactions
        - wait: '[data-testid="ledger-row"]'
        - select: { selector: '[data-testid="ledger-wallet-pick"]', value: Main Checking }
        - wait: 1500
        - click: '[data-testid="ledger-row"] >> nth=2'
        - wait: 500
        - shot:
            name: ledger-transactions
            caption: Every entry with a running balance, details on the right
        - fill: { selector: '[data-testid="ledger-add"]', value: 12.50 lunch Trattoria Roma cash }
        - wait: '[data-testid="ledger-add-preview"]'
        - shot:
            name: ledger-quick-add
            caption: Type one line and Trakli fills in the rest
            focus: ['[data-testid="ledger-add"]', '[data-testid="ledger-add-preview"]']
        - goto: /reports?tab=overview
        - wait: '[data-testid="reports"]'
        - wait: 2500
        - shot:
            name: ledger-reports
            caption: Reports with what stands out on the right
        - goto: /reports?tab=calendar
        - wait: 2500
        - click: '.cell:not(.cell--empty):not(.cell--zero) >> nth=-3'
        - wait: '[data-testid="reports-day-entries"]'
        - wait: 800
        - shot:
            name: ledger-reports-calendar
            caption: Pick a day and its entries show on the right
        - goto: /reports?tab=flow
        - wait: 2500
        - shot:
            name: ledger-reports-flow
            caption: Where money came from and where it went
        - goto: /budgets
        - wait: '[data-testid="ledger-budget-row"]'
        - wait: 2500
        - shot:
            name: ledger-budgets
            caption: Every budget in one table, with its last four months on the right
        - goto: /parties
        - wait: '[data-testid="ledger-person-row"]'
        - wait: 2500
        - shot:
            name: ledger-people
            caption: Who owes whom, with the history on the right
        - goto: /imports
        - wait: 1500
        - shot:
            name: ledger-imports
            caption: Bank statements turned into transactions
